apiVersion: v1
kind: Service
metadata:
  name: nginx-intern
  labels:
    app: nginx
spec:
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 80
  selector:
    app: nginx

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx1
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx2
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

