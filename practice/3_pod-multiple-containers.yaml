apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  restartPolicy: Never
  initContainers:
  - name: init-pod
    image: busybox:1.28
    command: ['sh', '-c', 'for i in {1..20}; do sleep 1; if nslookup 8.8.8.8; then exit 0; fi; done; exit 1']
  containers:
  - name: nginx
    image: nginx:latest
    ports:
      - containerPort: 80
  volumes: []

